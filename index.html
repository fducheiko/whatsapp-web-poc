<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Web · Prova de conceito</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Barra de navegação à esquerda. Visual apenas: só a aba de conversas funciona. -->
    <nav class="rail" aria-label="Navegação">
      <div class="rail__top">
        <div class="rail__btn is-active" title="Conversas">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z" />
          </svg>
          <span class="rail__badge" id="rail-badge" hidden>0</span>
        </div>
        <div class="rail__btn" title="Chamadas">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" />
          </svg>
        </div>
        <div class="rail__btn" title="Status">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="2.5 3" /></svg>
          <span class="rail__dot"></span>
        </div>
        <div class="rail__btn" title="Canais">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="2" />
            <path d="M16.2 7.8a6 6 0 0 1 0 8.5M7.8 16.3a6 6 0 0 1 0-8.5M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2" />
          </svg>
          <span class="rail__dot"></span>
        </div>
        <div class="rail__btn" title="Comunidades">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="8" r="3.5" />
            <path d="M2.5 20c.4-3.6 2.9-6 6.5-6s6.1 2.4 6.5 6" />
            <circle cx="17" cy="9" r="2.5" />
            <path d="M17 14c2.6 0 4.2 1.8 4.5 4.5" />
          </svg>
        </div>
        <div class="rail__sep"></div>
        <div class="rail__btn rail__btn--ai" title="Assistente">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3c.5 4.5 2.5 6.5 7 7-4.5.5-6.5 2.5-7 7-.5-4.5-2.5-6.5-7-7 4.5-.5 6.5-2.5 7-7z" />
          </svg>
        </div>
      </div>
      <div class="rail__bottom">
        <div class="rail__btn" title="Arquivadas">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="3" width="19" height="5" rx="1" />
            <path d="M4.5 8v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8" />
            <path d="M10 12h4" />
          </svg>
        </div>
        <div class="rail__avatar" title="Perfil" aria-hidden="true">V</div>
      </div>
    </nav>

    <!-- Coluna da lista: cabeçalho, busca, filtros, aviso e conversas -->
    <aside class="sidebar">
      <header class="sidebar__header">
        <h1 class="sidebar__title">WhatsApp</h1>
        <div class="sidebar__actions">
          <button class="icon-btn" id="regenerate-btn" type="button" title="Gerar novas conversas aleatórias" aria-label="Gerar novas conversas aleatórias">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16" />
              <path d="M3 21v-5h5" />
            </svg>
          </button>
          <div class="icon-btn" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor" /><circle cx="12" cy="12" r="1.6" fill="currentColor" /><circle cx="12" cy="19" r="1.6" fill="currentColor" /></svg>
          </div>
          <div class="new-chat" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </div>
        </div>
      </header>

      <div class="search">
        <label class="search__box">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-4.2-4.2" />
          </svg>
          <input id="search-input" type="search" placeholder="Pesquisar ou começar uma nova conversa" aria-label="Pesquisar conversas" autocomplete="off" />
        </label>
      </div>

      <div class="filters" id="filters" role="group" aria-label="Filtrar conversas"></div>

      <div class="banner" id="banner">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          <path d="M18.63 13A17.9 17.9 0 0 1 18 8" />
          <path d="M6.26 6.26A5.9 5.9 0 0 0 6 8c0 7-3 9-3 9h14" />
          <path d="M18 8a6 6 0 0 0-9.33-5" />
          <path d="M1 1l22 22" />
        </svg>
        <p class="banner__text">As notificações de mensagens e ligações estão desativadas. <span class="banner__link">Ativar</span></p>
        <button class="banner__close" id="banner-close" type="button" aria-label="Fechar aviso">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>

      <ul class="chat-list" id="chat-list"></ul>

      <div class="sidebar__footer">
        <span class="sidebar__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z" /></svg>
        </span>
        <span>Baixe o WhatsApp para Mac.</span>
      </div>
    </aside>

    <!-- Coluna da conversa: tela de boas-vindas ou conversa ativa -->
    <main class="chat">
      <section class="chat-empty" id="empty-state">
        <svg class="chat-empty__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z" />
        </svg>
        <h1>WhatsApp Web</h1>
        <p>Selecione uma conversa para começar.<br />Use o botão de atualizar para gerar novas conversas aleatórias.</p>
      </section>

      <div class="chat-view" id="chat-view" hidden>
        <header class="chat-header">
          <button class="icon-btn back-btn" id="back-btn" type="button" aria-label="Voltar para as conversas">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 12H5" />
              <path d="M12 19l-7-7 7-7" />
            </svg>
          </button>
          <div class="chat-header__avatar" id="chat-avatar"></div>
          <div class="chat-header__info">
            <div class="chat-header__title">
              <h2 class="chat-header__name" id="chat-name"></h2>
              <svg class="verified" id="chat-verified" viewBox="0 0 24 24" role="img" aria-label="Conta verificada" hidden>
                <circle cx="12" cy="12" r="10" fill="#53bdeb" />
                <path d="M7.5 12.5l3 3 6-6" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <p class="chat-header__status" id="chat-status"></p>
          </div>
          <div class="chat-header__actions" aria-hidden="true">
            <div class="icon-btn">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4.2-4.2" /></svg>
            </div>
            <div class="icon-btn">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor" /><circle cx="12" cy="12" r="1.6" fill="currentColor" /><circle cx="12" cy="19" r="1.6" fill="currentColor" /></svg>
            </div>
          </div>
        </header>

        <div class="messages" id="messages" role="log"></div>

        <form class="composer" id="composer">
          <div class="composer__tool" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </div>
          <div class="composer__tool" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" /><path d="M8.5 14c.9 1.1 2.1 1.7 3.5 1.7s2.6-.6 3.5-1.7" /><path d="M9 9.2h.01M15 9.2h.01" /></svg>
          </div>
          <textarea id="message-input" rows="1" placeholder="Digite uma mensagem" aria-label="Digite uma mensagem"></textarea>
          <div class="composer__tool composer__mic" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11.5" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></svg>
          </div>
          <button class="send-btn" id="send-btn" type="submit" aria-label="Enviar mensagem">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 2L11 13" />
              <path d="M22 2l-7 20-4-9-9-4 20-7z" />
            </svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <!-- Modal de opções: lista de seleção aberta pelo botão "Opções" -->
  <div class="modal" id="options-modal" hidden>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="options-title">
      <header class="modal__header">
        <button class="icon-btn modal__close" id="options-close" type="button" aria-label="Fechar opções">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
        <h2 class="modal__title" id="options-title">Opções</h2>
      </header>
      <div class="option-list" id="option-list" role="radiogroup" aria-labelledby="options-title"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="journey.js"></script>
  <script src="app.js"></script>
</body>
</html>
